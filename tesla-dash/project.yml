name: TeslaDash
options:
  bundleIdPrefix: pet.nele
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TeslaDash:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/TeslaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pet.nele.teslaDash
        PRODUCT_NAME: Tesla Dash
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tesla Dash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: Tesla Dash reads live car data from your S3XY Commander over its WiFi.
        NSLocationWhenInUseUsageDescription: Your location draws the trip route when the car's own GPS isn't available, and keeps recording while the screen is off.
        NSLocationAlwaysAndWhenInUseUsageDescription: Lets trips keep recording while the app is in the background.
