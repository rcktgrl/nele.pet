<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ship Card Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Saira:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}
/* Layout: editor panel beside a live trading card (stacked on phones, card first). Single dark look by choice; card tint follows --hue. */
:root{
  --hue:265;
  --void:#07050d; --card:hsl(var(--hue) 50% 9%); --card-hi:hsl(var(--hue) 52% 17%); --panel:hsl(var(--hue) 47% 13%); --line:hsl(var(--hue) 45% 28%);
  --accent:hsl(var(--hue) 100% 68%); --accent-soft:hsl(var(--hue) 55% 46%); --gold:#e8c35a; --gold-dim:#a88a3a;
  --ink:#efe9ff; --muted:#a99cc7;
  --ui:#120d1c; --ui-line:#2d2340; --ui-field:#0b0812;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"Saira",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;overflow-x:hidden;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 78% 9%,#fff6 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 64% 72%,#ffd9a088 50%,transparent 51%),radial-gradient(1px 1px at 30% 88%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 90% 55%,#fff7 50%,transparent 51%)}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
.cardcol{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:12px;grid-column:2;grid-row:1}
.editor{grid-column:1;grid-row:1;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.cardcol{position:static;grid-column:1;grid-row:1}.editor{grid-row:2}}
h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}

/* editor */
.bar-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 13px var(--f-body);color:var(--ink);background:var(--ui);border:1px solid var(--ui-line);border-radius:6px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent-soft)}.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn.primary{background:var(--gold);color:#241800;border-color:var(--gold)}
.btn.danger{color:#ff9b9b}
.toast{font-family:var(--f-data);font-size:12px;color:var(--gold)}
fieldset{border:1px solid var(--ui-line);background:var(--ui);border-radius:10px;padding:14px;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
legend{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--accent);padding:0 6px}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.full{grid-column:1/-1}
input,textarea,select{font:14px var(--f-body);color:var(--ink);background:var(--ui-field);border:1px solid var(--ui-line);border-radius:5px;padding:7px 9px;width:100%;box-sizing:border-box;text-transform:none;letter-spacing:0}
textarea{resize:vertical;min-height:64px;line-height:1.4}
textarea.code{font-family:var(--f-data);font-size:12px;min-height:180px}
input[type=range]{padding:0;accent-color:var(--gold)}
input[type=file]{font-size:12px}
.help{font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0;line-height:1.45}
.statrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 90px;gap:8px;align-items:center}
@media (max-width:480px){fieldset{grid-template-columns:minmax(0,1fr)}.statrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.statrow input[type=range]{grid-column:1/-1}}

/* card */
.stage{perspective:1400px;width:min(380px,100%)}
.card{position:relative;width:100%;aspect-ratio:63/102;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1);cursor:pointer;border:0;padding:0;background:none;color:inherit;font:inherit;text-align:left;display:block}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:18px}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  background:linear-gradient(160deg,var(--card-hi),var(--card) 45%,#0b0714);
  box-shadow:0 0 0 1.5px var(--gold-dim),0 0 0 5px var(--card),0 0 0 6px var(--line),0 24px 60px -12px hsl(var(--hue) 100% 60% / .4);
  display:flex;flex-direction:column;padding:14px 14px 12px;gap:9px}
.back{transform:rotateY(180deg)}
.flipped{transform:rotateY(180deg)}
.foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.2;
  background:linear-gradient(115deg,transparent 20%,#ff6ad5 35%,#8d5cff 45%,#5ce1ff 55%,#e8c35a 65%,transparent 80%);
  background-size:250% 250%;background-position:var(--fx,50%) var(--fy,50%)}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),#ffffff2e,transparent 45%)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,8vw,32px);line-height:.95;letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.name small{display:block;font-weight:500;font-size:12px;letter-spacing:.18em;color:var(--gold);margin-top:3px}
.cost{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 45%,#7d6020);color:#2a1a00;
  font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--gold-dim);text-align:center}
.cost span{font-size:8px;letter-spacing:.1em;display:block}
.cost span:first-child{font-size:20px;letter-spacing:0}
.art{position:relative;flex:none;height:31%;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--gold-dim);background:#000}
.art img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08)}
.art .noimg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-data);font-size:11px;color:var(--muted)}
.art .ident{position:absolute;right:8px;bottom:6px;font-family:var(--f-data);font-size:10px;color:var(--gold);letter-spacing:.12em;background:#07050dcc;padding:2px 6px;border-radius:3px}
.typeline{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 8px;border-radius:4px;background:linear-gradient(90deg,var(--accent-soft),var(--panel));gap:8px}
.typeline b{color:var(--gold);font-weight:700;white-space:nowrap}
.stats{margin:0;display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center}
.stats dt{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:11px}
.meter{height:6px;border-radius:3px;background:var(--panel);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--accent),var(--gold))}
.stats dd{margin:0;font-family:var(--f-data);font-size:11px;text-align:right;font-variant-numeric:tabular-nums;min-width:58px}
.ability{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:11.5px;line-height:1.38;display:flex;flex-direction:column;gap:4px}
.ability strong{font-family:var(--f-display);color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.flavour{font-size:10.5px;font-style:italic;color:var(--muted);line-height:1.4;margin:auto 0 0}
.foot{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-data);font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.back h2{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--gold)}
.lore{font-size:11px;line-height:1.45;margin:0}
.lore em{color:var(--gold);font-style:normal}
.slots{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;flex:1}
.slots h3{margin:0;font-family:var(--f-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.slots ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.slots li{font-family:var(--f-data);font-size:10px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.slots li span:last-child{color:var(--gold);text-align:right}
.hint{font-family:var(--f-data);font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0}
[hidden]{display:none!important}
#anim{width:min(400px,100%);height:auto;display:block}
.anim-ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#gifstat{margin:0;min-height:1em;text-align:center}
@media (prefers-reduced-motion:reduce){.card{transition:none}.foil{display:none}}
</style>
</head>
<body>


<div class="wrap">
  <div class="cardcol">
    <div class="stage">
      <button class="card" id="card" aria-label="Ship card. Tap to flip.">
        <div class="face front">
          <div class="top">
            <div class="name"><span id="c-name"></span><small id="c-type"></small></div>
            <div class="cost"><div><span id="c-rank"></span><span id="c-ranklbl"></span></div></div>
          </div>
          <div class="art"><img id="c-img" alt=""><span class="noimg" id="c-noimg" hidden>Upload a ship image</span><span class="ident" id="c-ident"></span></div>
          <div class="typeline"><span id="c-role"></span><b id="c-rarity"></b></div>
          <dl class="stats" id="c-stats"></dl>
          <div class="ability"><strong id="c-abt"></strong><span id="c-abx"></span></div>
          <p class="flavour" id="c-flav"></p>
          <div class="foot"><span id="c-fl"></span><span id="c-fr"></span></div>
          <div class="foil"></div><div class="glare"></div>
        </div>
        <div class="face back">
          <h2 id="c-bt"></h2>
          <p class="lore" id="c-lore"></p>
          <div class="slots" id="c-slots"></div>
          <div class="foot"><span id="c-bl"></span><span id="c-br"></span></div>
          <div class="foil"></div><div class="glare"></div>
        </div>
      </button>
    </div>
    <canvas id="anim" hidden aria-label="Card animation preview"></canvas>
    <p class="hint" id="hint">TAP TO FLIP · TILT TO SHINE</p>
    <div class="anim-ctl">
      <button type="button" class="btn" id="b-play">Play animation</button>
      <button type="button" class="btn primary" id="b-gif" hidden>Export GIF</button>
    </div>
    <p class="toast" id="gifstat" role="status"></p>
  </div>

  <form class="editor" id="f" autocomplete="off">
    <div>
      <h1>Ship Card <span>Forge</span></h1>
      <p class="sub">Edit any field and the card updates as you type. Saved cards stay in this browser.</p>
    </div>
    <div class="bar-top">
      <select id="pick" aria-label="Saved cards" style="width:auto;min-width:160px"></select>
      <button type="button" class="btn" id="b-new">New card</button>
      <button type="button" class="btn primary" id="b-save">Save card</button>
      <button type="button" class="btn danger" id="b-del">Delete</button>
      <span class="toast" id="toast" role="status"></span>
    </div>

    <fieldset>
      <legend>Ship</legend>
      <label>Ship name<input id="name"></label>
      <label>Ship type<input id="type"></label>
      <label>Ident<input id="ident"></label>
      <label>Role line<input id="role"></label>
      <label>Badge (big)<input id="rank" maxlength="4"></label>
      <label>Badge (small)<input id="ranklbl" maxlength="8"></label>
      <label>Rarity tag<input id="rarity"></label>
      <label>Card tint<input type="range" id="hue" min="0" max="359"></label>
    </fieldset>

    <fieldset>
      <legend>Image</legend>
      <label class="full">Ship screenshot<input type="file" id="img" accept="image/*"></label>
      <label>Crop left / right<input type="range" id="imgx" min="0" max="100"></label>
      <label>Crop up / down<input type="range" id="imgy" min="0" max="100"></label>
    </fieldset>

    <fieldset>
      <legend>Stats</legend>
      <div class="full" id="statrows" style="display:flex;flex-direction:column;gap:8px"></div>
      <p class="help full">Label, the value shown on the right, and how full the bar is.</p>
    </fieldset>

    <fieldset>
      <legend>Text</legend>
      <label class="full">Ability name<input id="abt"></label>
      <label class="full">Ability text<textarea id="abx"></textarea></label>
      <label class="full">Flavour line<input id="flav"></label>
      <label>Footer left<input id="fl"></label>
      <label>Footer right<input id="fr"></label>
    </fieldset>

    <fieldset>
      <legend>Back of card</legend>
      <label class="full">Back title<input id="bt"></label>
      <label class="full">Story<textarea id="lore"></textarea><span class="help">Wrap words in *stars* to make them gold.</span></label>
      <label class="full">Loadout<textarea id="slots" class="code"></textarea>
        <span class="help">A line ending in a colon starts a section. Use "Module | blueprint grade · experimental" to put the engineering on the right in gold, e.g. "8A Power Plant | Overcharged G5".</span></label>
      <label>Back footer left<input id="bl"></label>
      <label>Back footer right<input id="br"></label>
    </fieldset>
  </form>
</div>

<script>
const VIDAR={id:'vidar',name:'EFS Vidar',type:'Anaconda Mk II',ident:'A05-AA',role:'Multi-role laser frigate',rank:'V',ranklbl:'ELITE',rarity:'✦ Legendary',hue:265,
 img:'vidar.jpg',imgx:52,imgy:50,
 stats:[['Jump','54.82 ly',78],['Shields','8C Bi-Weave',96],['Firepower','6× beam',84],['Cargo','96 t',30],['Power','8A O/C',92]],
 abt:'Thermal Shock Broadside',abx:'Six beam lasers fire at once and heat up every ship they hit. The fast-charging Bi-Weave shields recover after each exchange.',
 flav:'"Son of Odin. Last one standing."',fl:'CMDR Archadder · ASOG',fr:'02 / Odin line',
 bt:'The Odin Line',
 lore:"The commander's first Anaconda was the *EFS Odin*. When the Mk II arrived, its name came from the same myth: *Vidar*, Odin's son and the silent god of vengeance, who avenged his father and lived on into the new world. It is a successor ship with a successor's name.",
 slots:`Hardpoints:
4A Beam Laser (fixed) | Efficient G5 · Thermal Shock
2× 3C Beam Laser (gimballed) | Efficient G5 · Thermal Shock
2× 3C Beam Laser (gimballed) | Efficient G5 · Thermal Vent
1F Beam Laser (turreted) | Efficient G5 · Concordant Seq.
1G Multi-cannon (turreted) | High cap G5 · Corrosive
Utility:
4× 0A Shield Booster | Heavy duty G5 · Super Caps
2× 0A Shield Booster | Resist aug G5 · Super Caps
0I Point Defence · 0I Heat Sink
Core:
8A Power Plant | Overcharged G4
8A Frame Shift Drive (SCO) | Inc. range G5 · Mass Mgr
8A Power Distributor | Charge enhanced G5
7A Thrusters | Dirty G4 · Drive Distrib.
1I Military Grade Composite | Heavy duty G5
Optional:
8C Bi-Weave Shield | Reinforced G5 · Fast Charge
4× Guardian Shield Reinf. | 5D 5D 5D 4D
5H Guardian FSD Booster | +range
7A Fuel Scoop · 5A Collector
7D Mk II Vessel Hangar
4F Mk II Planetary Vehicle Hangar
6D Mk II Cargo Rack | 96 t
DSS · SC Assist · Adv. Docking`,
 bl:'Angel Special Operations Group',br:'A05-AA'};
const BLANK={id:'',name:'New ship',type:'Ship type',ident:'XX-00',role:'Role',rank:'I',ranklbl:'RANK',rarity:'✦ Rare',hue:200,img:'',imgx:50,imgy:50,
 stats:[['Jump','— ly',50],['Shields','—',50],['Firepower','—',50],['Cargo','— t',50],['Speed','— m/s',50]],
 abt:'Ability name',abx:'What this ship does best.',flav:'"A line of flavour."',fl:'CMDR —',fr:'01',bt:'Ship history',lore:'Where the *name* comes from.',slots:'Hardpoints:\nModule | engineering',bl:'',br:''};

const $=id=>document.getElementById(id);
const FIELDS=['name','type','ident','role','rank','ranklbl','rarity','hue','imgx','imgy','abt','abx','flav','fl','fr','bt','lore','slots','bl','br'];
let cur=structuredClone(VIDAR);
function load(){try{return JSON.parse(localStorage.getItem('shipcards')||'[]')}catch(e){return []}}
function store(list){try{localStorage.setItem('shipcards',JSON.stringify(list));return true}catch(e){return false}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const c=cur;
  document.documentElement.style.setProperty('--hue',c.hue);
  for(const k of ['name','type','ident','role','rank','ranklbl','rarity','abt','abx','flav','fl','fr','bt','bl','br']) $('c-'+k).textContent=c[k]||'';
  const img=$('c-img');
  if(c.img){img.hidden=false;$('c-noimg').hidden=true;if(img.getAttribute('src')!==c.img)img.src=c.img;img.style.objectPosition=`${c.imgx}% ${c.imgy}%`;img.alt=(c.name||'Ship')+' screenshot'}
  else{img.hidden=true;$('c-noimg').hidden=false}
  $('c-stats').innerHTML=c.stats.map(([l,v,p])=>`<dt>${esc(l)}</dt><div class="meter" style="--v:${+p||0}%"><i></i></div><dd>${esc(v)}</dd>`).join('');
  $('c-lore').innerHTML=esc(c.lore).replace(/\*([^*]+)\*/g,'<em>$1</em>');
  let h='',open=false;
  for(const raw of (c.slots||'').split('\n')){const line=raw.trim();if(!line)continue;
    if(line.endsWith(':')){if(open)h+='</ul>';h+=`<h3>${esc(line.slice(0,-1))}</h3><ul>`;open=true;continue}
    if(!open){h+='<ul>';open=true}
    const [a,b]=line.split('|').map(s=>s.trim());h+=`<li><span>${esc(a)}</span><span>${esc(b||'')}</span></li>`}
  if(open)h+='</ul>';$('c-slots').innerHTML=h;
}
function fillForm(){
  for(const k of FIELDS) $(k).value=cur[k]??'';
  $('statrows').innerHTML=cur.stats.map((s,i)=>`<div class="statrow">
    <input id="sl${i}" aria-label="Stat ${i+1} label" value="${esc(s[0])}">
    <input id="sv${i}" aria-label="Stat ${i+1} value" value="${esc(s[1])}">
    <input id="sp${i}" aria-label="Stat ${i+1} bar" type="range" min="0" max="100" value="${+s[2]||0}"></div>`).join('');
  $('img').value='';
}
function readForm(){
  for(const k of FIELDS) cur[k]=$(k).value;
  cur.stats=cur.stats.map((_,i)=>[$('sl'+i).value,$('sv'+i).value,+$('sp'+i).value]);
}
function fillPick(sel){
  const list=load();
  $('pick').innerHTML=`<option value="vidar">EFS Vidar (example)</option>`+list.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')+(sel===''?`<option value="" selected>Unsaved card</option>`:'');
  if(sel!=='') $('pick').value=sel;
}
let tt;function toast(m){$('toast').textContent=m;clearTimeout(tt);tt=setTimeout(()=>$('toast').textContent='',2600)}

$('f').addEventListener('input',e=>{if(e.target.id==='img'||e.target.id==='pick')return;readForm();render()});
$('img').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,1200/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cur.img=cv.toDataURL('image/jpeg',.8);render();toast('Image added')};im.src=r.result};r.readAsDataURL(file)});
let delArm=false;
$('pick').addEventListener('change',()=>{const v=$('pick').value;
  cur=v==='vidar'?structuredClone(VIDAR):structuredClone(load().find(c=>c.id===v)||VIDAR);fillForm();render();delArm=false;$('b-del').textContent='Delete'});
$('b-new').addEventListener('click',()=>{cur=structuredClone(BLANK);fillForm();render();fillPick('');toast('New card started')});
$('b-save').addEventListener('click',()=>{
  readForm();const list=load();
  if(!cur.id||cur.id==='vidar')cur.id='c'+Date.now().toString(36);
  const i=list.findIndex(c=>c.id===cur.id);if(i>=0)list[i]=structuredClone(cur);else list.push(structuredClone(cur));
  if(store(list)){fillPick(cur.id);toast('Saved: '+cur.name)}else toast('Could not save. The browser blocked storage or it is full.')});
$('b-del').addEventListener('click',()=>{
  if(!cur.id||cur.id==='vidar'){toast('The example card cannot be deleted');return}
  if(!delArm){delArm=true;$('b-del').textContent='Tap again to delete';return}
  delArm=false;$('b-del').textContent='Delete';store(load().filter(c=>c.id!==cur.id));cur=structuredClone(VIDAR);fillForm();render();fillPick('vidar');toast('Card deleted')});

const card=$('card');

function slotItems(c,w){const it=[];let first=true;

    const [a,b]=line.split('|').map(s=>s.trim());font(c,400,10,MO);const two=b&&c.measureText(a).width+c.measureText(b).width+8>w;

const anim=$('anim');let playing=false,raf=0,t0=0,pImg=null;
async function startPlay(){await fontsReady();pImg=await getImg();const S=Math.min(2,window.devicePixelRatio||1);anim.width=Math.round(VW*S);anim.height=Math.round(VH*S);
  anim.hidden=false;document.querySelector('.stage').hidden=true;$('hint').hidden=true;playing=true;$('b-play').textContent='Show card';t0=performance.now();

$('f').addEventListener('input',async e=>{if(playing&&e.target.id!=='img')pImg=await getImg()});

/* GIF encoder (median-cut palette + LZW) */
function medianCut(hist){

  const stat=b=>{const mn=[31,31,31],mx=[0,0,0];let n=0;for(const c of b.c){for(let k=0;k<3;k++){const v=ch[k](c);if(v<mn[k])mn[k]=v;if(v>mx[k])mx[k]=v}n+=hist[c]}b.n=n;b.r=[mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]];b.s=Math.max(...b.r)*Math.sqrt(n);return b};
  let boxes=[stat({c:cols})];
  while(boxes.length<255){let bi=-1,bs=0;boxes.forEach((b,i)=>{if(b.c.length>1&&b.s>bs){bs=b.s;bi=i}});if(bi<0)break;
    const b=boxes[bi],ax=b.r.indexOf(Math.max(...b.r)),f=ch[ax];b.c.sort((p,q)=>f(p)-f(q));
    let acc=0,cut=1;for(let i=0;i<b.c.length;i++){acc+=hist[b.c[i]];if(acc>=b.n/2){cut=Math.min(Math.max(i,1),b.c.length-1);break}}
    boxes.splice(bi,1,stat({c:b.c.slice(0,cut)}),stat({c:b.c.slice(cut)}))}

  boxes.forEach((b,i)=>{let r=0,g=0,bb=0;for(const c of b.c){const w=hist[c];r+=ch[0](c)*w;g+=ch[1](c)*w;bb+=ch[2](c)*w;lut[c]=i}
    pal[i*3]=Math.min(255,Math.round(r/b.n*8.226));pal[i*3+1]=Math.min(255,Math.round(g/b.n*8.226));pal[i*3+2]=Math.min(255,Math.round(bb/b.n*8.226))});
  return {pal,lut,n:boxes.length}}
class Bytes{constructor(){this.a=new Uint8Array(1<<20);this.n=0}grow(k){if(this.n+k>this.a.length){const b=new Uint8Array(Math.max(this.a.length*2,this.n+k));b.set(this.a.subarray(0,this.n));this.a=b}}

  const emit=c=>{cur_|=c<<shift;shift+=cs;while(shift>=8){ob(cur_&255);cur_>>>=8;shift-=8}};
  emit(256);let pre=idx[0];
  for(let i=1;i<idx.length;i++){const k=idx[i],key=(pre<<8)|k;if(STAMP[key]===GEN){pre=TAB[key];continue}
    emit(pre);if(next===4096){emit(256);next=258;cs=9;GEN++}else{if(next>=(1<<cs))cs++;TAB[key]=next++;STAMP[key]=GEN}pre=k}
  emit(pre);emit(257);if(shift>0)ob(cur_&255);if(bl){buf.byte(bl);buf.bytes(block.subarray(0,bl))}buf.byte(0)}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function buildGif(onProgress){
  await fontsReady();const img=await getImg();const S=1.2,W=Math.round(VW*S),H=Math.round(VH*S);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d',{willReadFrequently:true});
  const plan=[],add=(a,b)=>{for(let t=a;t<b-1e-6;t+=.08)plan.push([t,8])};
  add(0,1);plan.push([1,200]);add(3,3.5);plan.push([3.5,200]);add(5.5,8.5);add(8.5,9);
  const hist=new Uint32Array(32768);

    for(let p=0,j=0;j<idx.length;p+=4,j++){const bin=((d[p]>>3)<<10)|((d[p+1]>>3)<<5)|(d[p+2]>>3);let v=lut[bin];if(v<0)v=lut[bin]=near(bin);idx[j]=v}
